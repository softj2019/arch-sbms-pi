name: CD - Pi Deploy

on:
  push:
    branches: [prod]
    paths:
      - 'docker/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Pi Runner에서 자체 배포 (git pull + restart)
  # 각 Pi에 설치된 runner가 자기 자신을 업데이트
  # ─────────────────────────────────────────────
  deploy:
    name: "Self-Deploy"
    runs-on: [self-hosted, pi]
    steps:
      - name: Pull & Restart
        run: |
          echo "=== $(hostname) ==="
          cd /home/admin/gunpo
          git fetch origin prod 2>&1 | tail -3
          git checkout prod 2>/dev/null
          git reset --hard origin/prod
          echo "Commit: $(git log --oneline -1)"
          sudo systemctl restart main_ctl
          sleep 3
          echo "main_ctl: $(systemctl is-active main_ctl)"
          echo "cv2_ffmpeg: $(systemctl is-active cv2_ffmpeg)"
          echo "=== DONE ==="
