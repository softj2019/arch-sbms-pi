name: CD - Pi Deploy

on:
  push:
    branches: [prod]
    paths:
      - 'docker/**'
      - '.github/workflows/cd.yml'

  workflow_dispatch:
    inputs:
      targets:
        description: '배포 대상 (all 또는 쉼표 구분 IP)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # 릴리스 태그 + 아티팩트 생성
  # ─────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d').${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag & release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}" 2>/dev/null || true
          git push origin "${{ steps.version.outputs.version }}" 2>/dev/null || true

      - name: Summary
        run: |
          echo "## Release ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pi 배포를 실행하세요:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "cd D:/home/spms-pi && bash deploy_phase5.sh" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "또는 자동 배포 데몬이 실행 중이면 자동으로 배포됩니다." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # Pi 배포 (로컬 runner가 있을 때만 실행)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Pi Devices
    needs: release
    runs-on: [self-hosted, pi-deploy]
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          bash deploy_phase5.sh 2>&1 || bash deploy_from_local.sh 2>&1 || echo "로컬 Pi 배포 runner 없음 - 수동 배포 필요"
